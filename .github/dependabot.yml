version: 2

updates:
  # NuGet versions are centrally managed in Directory.Packages.props; Dependabot
  # understands central package management and will update that file directly.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # These ship in lockstep and are pointless to review separately.
      microsoft-extensions:
        patterns:
          - Microsoft.Extensions.*
      test-stack:
        patterns:
          - xunit*
          - Microsoft.NET.Test.Sdk
          - coverlet.*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # A cargo entry for /engine belongs here once Phase 3 creates that directory. Declaring it
  # early made Dependabot fail on every run against a path that does not exist.
